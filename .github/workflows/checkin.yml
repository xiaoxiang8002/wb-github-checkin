name: WorkBuddy 自动签到

on:
  schedule:
    # 北京时间每天 00:30（= UTC 前一天 16:30）为主，12:30（= UTC 04:30）为备份兜底。
    # 两次都在"我们这里的时间"，互为冗余：某次撞上 GitHub 抖动或 token 临时失效，另一次会补。
    # 签到本身是幂等的，当天漏领次日仍会补，但两次 slot 大幅降低漏领概率。
    # 注意：公开仓库超过 60 天无任何提交会被自动停用定时任务，
    # renew_github.py 每周续期时会做一次空提交保活，无需手动干预。
    - cron: "30 16 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发一次

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check-in
        env:
          WB_ACCOUNTS: ${{ secrets.WB_ACCOUNTS }}
          WB_WARN_DAYS: "7"
          WB_NOTIFY_ON_SUCCESS: "0"
          WB_FAIL_ON_ERROR: "0"
        run: python checkin.py
